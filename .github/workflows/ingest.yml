name: Ingest

# Der kostenlose Cron-Ersatz.
#
# Render berechnet Cron-Jobs, Vercel Hobby erlaubt einen pro Tag, hat 10 s
# Timeout und verbietet kommerzielle Nutzung. GitHub Actions gibt privaten
# Repos rund 2000 Minuten im Monat und 6 Stunden pro Job. Ein Batch-Job wie
# dieser gehoert genau hierhin, nicht auf einen Webserver.
#
# Bei 4 Laeufen taeglich a ~3 Minuten sind das etwa 360 Minuten im Monat.

on:
  schedule:
    # Alle 3 Stunden, also acht Laeufe am Tag.
    #
    # Die Geschichte dieser Zeile, weil sie zweimal falsch war:
    #
    # Zuerst standen hier drei Stunden mit der Rechnung "acht Laeufe a
    # rund fuenf Minuten". Die fuenf Minuten waren geraten, der erste
    # echte Lauf lief ins Zeitlimit von zwanzig. Acht mal zwanzig sind
    # 4800 Minuten im Monat, und private Repos haben 2000 - also runter
    # auf sechs Stunden.
    #
    # Seit das Repo OEFFENTLICH ist, sind die Actions-Minuten unbegrenzt.
    # Damit faellt der einzige Grund fuer sechs Stunden weg.
    #
    # Was haeufigere Laeufe NICHT bringen: mehr Karten. Das
    # Gemini-Gratiskontingent sind 20 Anfragen pro Tag, Modell und
    # Projekt - bei sechs brauchbaren Modellen und fuenf Schluesseln also
    # rund 600 am Tag, egal wie oft jemand fragt. Haeufiger heisst:
    # derselbe Vorrat in kleineren Portionen.
    #
    # Was sie sehr wohl bringen, sind zwei Dinge:
    #
    #   Aktualitaet  Eine Nachricht ist hoechstens drei statt sechs
    #                Stunden alt, bevor sie im Feed auftaucht.
    #   Verteilung   Der Tagesvorrat wird ueber den Tag ausgegeben statt
    #                im ersten Lauf. Vorher konnte der Lauf um 00:17 das
    #                ganze Kontingent verbrauchen, und alles, was danach
    #                veroeffentlicht wurde, kam erst am naechsten Tag
    #                dran. Dafuer sind die Obergrenzen je Lauf unten
    #                deutlich kleiner geworden - das ist der eigentliche
    #                Hebel, nicht das Intervall.
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Trockenlauf (nichts schreiben)"
        type: boolean
        default: false
      source:
        description: "Nur diese Quellen-ID (leer = alle)"
        type: string
        default: ""
      # Setzt der Cloudflare Worker (workers/ingest-anstoss), nicht du. Er
      # stoesst den Lauf an, weil GitHubs eigener Zeitplan oben Laeufe
      # auslaesst. Damit sich so ein Lauf wie ein geplanter verhaelt - Kurse
      # nur zu ihren Uhrzeiten, im Kontrollzentrum als geplant gezaehlt -,
      # muss er sich von einem Start von Hand unterscheiden lassen.
      zeitplan:
        description: "Vom Zeitplan angestossen (Cloudflare) - nicht von Hand setzen"
        type: boolean
        default: false

concurrency:
  # Zwei gleichzeitige Laeufe wuerden dieselben Artikel doppelt verarbeiten
  # und das Kontingent verbrennen.
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    # Grosszuegiger als die Summe der Schritte unten (12 + 9 + 6 + 3).
    # Dieses Limit soll nie greifen: ein Abschuss auf Job-Ebene
    # ueberspringt auch die Bilanz, und dann fehlt genau die Information,
    # warum es zu lange gedauert hat.
    timeout-minutes: 34
    env:
      # schedule, zeitplan (Cloudflare) oder workflow_dispatch (von Hand).
      # Liest pipeline/laufbilanz.py und der Kurs-Schritt unten.
      LAUF_AUSLOESER: ${{ inputs.zeitplan && 'zeitplan' || github.event_name }}

    steps:
      # v5/v6 statt v4/v5: die aelteren laufen auf Node 20, und das meldet
      # GitHub seit September 2025 als veraltet. Es ist nur eine Warnung -
      # aber eine, die bei jedem Lauf in den Annotationen steht und damit
      # den Blick auf die echte Fehlermeldung verstellt.
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      # --- Vorpruefung ---------------------------------------------------
      #
      # Der Anlass: sechs Laeufe in Folge endeten mit "Process completed
      # with exit code 1" nach 18 bis 28 Sekunden. Das ist alles, was in
      # den Annotationen steht - welcher Schritt gestorben ist und woran,
      # steht dort nicht. Man muss den Lauf aufklappen, den richtigen
      # Schritt finden und lesen.
      #
      # Genau das soll dieser Schritt ueberfluessig machen. Er laeuft VOR
      # pip install, kostet zwei Sekunden und beantwortet die beiden
      # Fragen, die bei einem frisch eingerichteten Repo fast immer die
      # Ursache sind: ist das Secret ueberhaupt gesetzt, und funktioniert
      # es?
      #
      # Ausgegeben werden nur NAMEN und Statuscodes, nie ein Wert. GitHub
      # wuerde einen Secret-Wert zwar maskieren, aber darauf verlaesst man
      # sich nicht - der Wert wird hier gar nicht erst angefasst.
      - name: Vorpruefung
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          # Namen, die schon einmal verwechselt wurden. Ein Secret, das es
          # nicht gibt, ist hier einfach leer - das kostet nichts und
          # erlaubt die Frage "meintest du vielleicht das hier?".
          TIPPFEHLER_SUPERBASE_URL: ${{ secrets.SUPERBASE_URL }}
          TIPPFEHLER_SUPERBASE_KEY: ${{ secrets.SUPERBASE_SERVICE_ROLE_KEY }}
          TIPPFEHLER_SERVICE_ROLE_KEY: ${{ secrets.SERVICE_ROLE_KEY }}
          TIPPFEHLER_SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          echo "Python: $(python -V)"
          echo

          fehlt=""
          echo "Pflicht-Secrets:"
          for name in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY GEMINI_API_KEY; do
            if [ -z "${!name}" ]; then
              echo "  FEHLT    $name"
              fehlt="$fehlt $name"
            else
              echo "  gesetzt  $name"
            fi
          done

          echo
          echo "Optional (jeder weitere Gemini-Schluessel ist ein weiteres Tageskontingent):"
          for name in GEMINI_API_KEY_2 GEMINI_API_KEY_3 GEMINI_API_KEY_4 \
                      GEMINI_API_KEY_5 VAPID_PUBLIC_KEY VAPID_PRIVATE_KEY \
                      VAPID_SUBJECT; do
            if [ -z "${!name}" ]; then echo "  -        $name"; else echo "  gesetzt  $name"; fi
          done

          if [ -n "$fehlt" ]; then
            echo
            echo "::error::Diese Secrets fehlen:$fehlt"
            echo "Eintragen unter: Settings -> Secrets and variables -> Actions."
            echo "Ohne sie bricht pipeline/run.py sofort ab - genau das war"
            echo "die Ursache, wenn ein Lauf nach rund 20 Sekunden rot wird."

            # "Es fehlt" und "es heisst anders" sehen von hier aus gleich
            # aus, fuehren aber zu voellig verschiedenen Suchen. Der Name
            # SUPERBASE hat einmal eine Stunde gekostet: die Secrets waren
            # laengst eingetragen, nur unter einem Namen, den der Workflow
            # nie liest. Von aussen ununterscheidbar von "vergessen".
            if [ -n "$TIPPFEHLER_SUPERBASE_URL" ] || [ -n "$TIPPFEHLER_SUPERBASE_KEY" ]; then
              echo
              echo "::error::Es gibt hier Secrets mit SUPERBASE im Namen. Die Datenbank heisst SUPABASE - mit A in der Mitte, nicht ER. Anlegen unter dem richtigen Namen und die falschen loeschen."
            fi
            if [ -n "$TIPPFEHLER_SERVICE_ROLE_KEY" ] || [ -n "$TIPPFEHLER_SUPABASE_KEY" ]; then
              echo
              echo "::error::Es gibt ein Secret SERVICE_ROLE_KEY oder SUPABASE_KEY. Gebraucht wird der volle Name SUPABASE_SERVICE_ROLE_KEY."
            fi
            exit 1
          fi

          # Gesetzt heisst nicht gueltig. Ein abgelaufener oder falsch
          # kopierter Schluessel sieht bis hierher aus wie ein richtiger,
          # und der Lauf stirbt erst zwei Minuten spaeter mitten im Ingest.
          echo
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
                 -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
                 -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
                 "$SUPABASE_URL/rest/v1/sources?select=id&limit=1" || echo "000")
          echo "Supabase antwortet: HTTP $code"
          case "$code" in
            200) echo "  Datenbank erreichbar, Schluessel gilt." ;;
            401|403) echo "::error::Supabase weist den Schluessel ab (HTTP $code). Ist es wirklich der service_role Key?"; exit 1 ;;
            000) echo "::error::Supabase gar nicht erreichbar. Stimmt SUPABASE_URL?"; exit 1 ;;
            *)   echo "::warning::Unerwartete Antwort HTTP $code - der Lauf geht trotzdem weiter." ;;
          esac

      - name: Abhaengigkeiten
        run: pip install -r pipeline/requirements.txt

      - name: Pipeline
        # Zwoelf Minuten als Notbremse, neun als eigene Frist des Skripts.
        # Die Reihenfolge ist Absicht: run.py soll von selbst aufhoeren
        # und seinen Puffer schreiben, nicht abgeschossen werden.
        timeout-minutes: 12
        env:
          MAX_RUN_MINUTES: "9"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Das Gratiskontingent gilt pro Google-PROJEKT: 20 Anfragen am
          # Tag und Modell. Jeder weitere Schluessel aus einem WEITEREN
          # Projekt ist ein kompletter zweiter Satz - fuenf Schluessel mal
          # neun Modelle mal zwanzig sind 900 statt 180 am Tag.
          #
          # Fehlt eines der Secrets, ist die Variable leer und wird
          # uebersprungen (config._keys filtert Leeres und Dubletten).
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          # Beide Namen sind geprueft, nicht geraten:
          # gemini-flash-latest zeigt auf das jeweils neueste Flash-Modell
          # und ist genau deshalb staendig ausgelastet (503). text-embedding-004
          # gibt es gar nicht mehr (404). Faellt gemini-3.5-flash aus, weicht
          # die Pipeline selbst aus - siehe FALLBACK_MODELS.
          GEMINI_MODEL: gemini-3.5-flash
          GEMINI_EMBEDDING_MODEL: gemini-embedding-001
          INGEST_LANGUAGES: de,en
          # Sicherheitsnetz: eine Schleife darf nicht das ganze Kontingent
          # verbrennen, bevor jemand es merkt.
          #
          # 120 waren richtig, solange zwoelf Quellen Volltext liefern
          # durften. Mit 0059 sind es einundzwanzig, also rund 22 Feeds mal
          # 8 Eintraege - nach Abzug der Artikel, die sich nicht sauber
          # extrahieren lassen, etwa 144. Der Deckel haette also jeden Lauf
          # die letzten zwei, drei Quellen abgeschnitten, und zwar immer
          # dieselben: die Reihenfolge kommt unsortiert aus der Datenbank.
          #
          # 250 laesst Luft fuer weitere Quellen und kostet nichts: der
          # bindende Deckel ist das Gemini-Tageskontingent
          # (MAX_GEMINI_CALLS_PER_RUN und die 20 Anfragen pro Modell und
          # Tag), nicht die Zahl der angesehenen Artikel.
          MAX_ITEMS_PER_RUN: "250"
          # 45 statt 300 - und das ist eine Verschaerfung mit Absicht.
          #
          # Gezaehlt werden Karten-, Drehbuch- und Einbettungsaufrufe
          # zusammen; gemessen sind das rund 3,8 je fertiger Karte (30
          # Karten in 114 Aufrufen). Der Tagesvorrat liegt bei etwa 600
          # Modellanfragen, verteilt auf acht Laeufe also rund 100 je
          # Lauf fuer alle drei Schritte zusammen.
          #
          # 300 hiess in der Praxis: der erste Lauf des Tages nimmt
          # alles. Was um zehn Uhr veroeffentlicht wird, kam dann erst am
          # naechsten Tag dran - bei Nachrichten der Unterschied zwischen
          # aktuell und egal.
          MAX_GEMINI_CALLS_PER_RUN: "45"
          # Karten gehen live, OHNE dass jemand draufschaut - aber nur von
          # Quellen mit hohem Vertrauenswert (>= 80: Institutionen,
          # Forschungseinrichtungen). Alles darunter landet weiter auf
          # 'pending' und wartet. Die Grenze steht in pipeline/run.py.
          #
          # Was das NICHT heisst: dass geprueft wird. Die deterministische
          # Pruefung faengt erfundene Zahlen und Namen, aber keine plausibel
          # klingende falsche Aussage. Wer das nicht will, stellt hier
          # wieder "false" ein und gibt von Hand frei.
          AUTO_APPROVE: "true"
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: |
          # pipefail, sonst schluckt tee den Rueckgabewert von python und
          # ein abgestuerzter Lauf sieht gruen aus. Das ist die
          # klassische Falle an dieser Stelle.
          set -o pipefail
          python pipeline/run.py ${{ inputs.source && format('--source {0}', inputs.source) || '' }} \
            2>&1 | tee -a "$RUNNER_TEMP/ingest.log"

      # --- Evergreen ----------------------------------------------------
      #
      # Laeuft NACH den Nachrichten und mit dem, was vom Tageskontingent
      # uebrig ist. Die Reihenfolge ist Absicht: Nachrichten sind nur
      # heute etwas wert, ein Wikipedia-Artikel ueber Zinseszins auch
      # morgen noch. Was heute nicht drankommt, holt der naechste Lauf.
      #
      # `continue-on-error`, weil ein Fehlschlag hier den Nachrichtenlauf
      # nicht nachtraeglich rot faerben soll - der ist zu dem Zeitpunkt
      # schon durch und hat geschrieben.
      - name: Evergreen-Karten
        continue-on-error: true
        timeout-minutes: 9
        env:
          MAX_RUN_MINUTES: "6"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_MODEL: gemini-3.5-flash
          GEMINI_EMBEDDING_MODEL: gemini-embedding-001
          INGEST_LANGUAGES: de,en
          # Etwas weniger als die Nachrichten: die sind nur heute etwas
          # wert, ein Wikipedia-Artikel auch morgen noch. Was hier nicht
          # drankommt, holt der naechste Lauf - in drei Stunden.
          MAX_GEMINI_CALLS_PER_RUN: "35"
          AUTO_APPROVE: "true"
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: |
          set -o pipefail
          python pipeline/evergreen.py 2>&1 | tee -a "$RUNNER_TEMP/evergreen.log"

      # --- Kurse ---------------------------------------------------------
      #
      # Ein Kurs kostet sechs bis zwoelf Aufrufe (Bogen, fuenf Lektionen,
      # Wiederholungen, Drehbuecher) - so viel wie sechs neue Feed-Karten.
      # Deshalb nicht in jedem Lauf, sondern zweimal am Tag: in den Laeufen
      # um 09:17 und 18:17 UTC. Die Stunden als Bereich, weil GitHub
      # geplante Laeufe oft eine halbe Stunde und mehr verspaetet startet;
      # ein 09:17-Lauf, der um 10:05 beginnt, soll trotzdem zaehlen.
      #
      # Nach Evergreen, vor dem Nachruesten: eine neue Feed-Karte geht vor,
      # ein Kurs vor einer schoeneren Darstellung einer alten Karte.
      - name: Kurse
        continue-on-error: true
        timeout-minutes: 8
        env:
          MAX_RUN_MINUTES: "5"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_MODEL: gemini-3.5-flash
          INGEST_LANGUAGES: de,en
          MAX_GEMINI_CALLS_PER_RUN: "16"
          AUTO_APPROVE: "true"
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: |
          set -o pipefail
          stunde=$(date -u +%H)
          if [ "$LAUF_AUSLOESER" = "schedule" ] || [ "$LAUF_AUSLOESER" = "zeitplan" ]; then
            case "$stunde" in
              09|10|11|18|19|20) ;;
              *) echo "Kurse nur in den Laeufen um 09:17 und 18:17 UTC (jetzt $stunde Uhr)."; exit 0 ;;
            esac
          fi
          python pipeline/courses.py 2>&1 | tee -a "$RUNNER_TEMP/kurse.log"

      # --- Erklaerkarten nachruesten -------------------------------------
      #
      # Der Anteil an Erklaerkarten ist eine Quote ueber den BESTAND. Jede
      # neue Textkarte senkt ihn, auch wenn kein einziges Drehbuch
      # misslingt - genau das ist passiert: nach dem Nachruesten stand er
      # bei 50 Prozent, vier Laeufe spaeter bei 42, ohne dass etwas kaputt
      # war. Der Zulauf hat den Nenner vergroessert.
      #
      # Also muss das Nachruesten mitlaufen und nicht von Hand gestartet
      # werden. Es kommt ZULETZT und bekommt, was vom Tageskontingent uebrig
      # ist: eine neue Karte ist mehr wert als eine bessere Darstellung
      # einer alten. Ist nichts uebrig, bricht das Skript nach dem ersten
      # Fehlversuch ab (gen.exhausted) und kostet Sekunden.
      #
      # Wie oft, entscheidet die Sichtbarkeit des Repos - und zwar von
      # selbst.
      #
      # PRIVAT gibt GitHub 2000 Actions-Minuten im Monat, und vier Laeufe
      # taeglich sind davon schon der groessere Teil. Dann laeuft die
      # Nachruestung nur im 06:17-Lauf; sie arbeitet ueber Tage, nicht ueber
      # Stunden, das reicht.
      #
      # OEFFENTLICH sind die Minuten unbegrenzt. Dann gibt es keinen Grund
      # zu sparen, und sie laeuft in jedem Lauf.
      #
      # `github.event.repository.private` steht auch im schedule-Ereignis
      # zur Verfuegung. Damit muss beim Umstellen niemand daran denken,
      # diese Datei anzufassen - und genau daran denkt man nicht.
      - name: Erklaerkarten nachruesten
        continue-on-error: true
        timeout-minutes: 6
        env:
          MAX_RUN_MINUTES: "4"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_MODEL: gemini-3.5-flash
          # Der Rest. Nachruesten ist die am wenigsten dringende Arbeit:
          # eine neue Karte ist mehr wert als eine bessere Darstellung
          # einer alten.
          MAX_GEMINI_CALLS_PER_RUN: "20"
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          REPO_PRIVAT: ${{ github.event.repository.private }}
        run: |
          set -o pipefail
          stunde=$(date -u +%H)
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]              && [ "$REPO_PRIVAT" = "true" ] && [ "$stunde" != "06" ]; then
            echo "Privates Repo, Minutenbudget: die Nachruestung laeuft nur"
            echo "im 06:17-Lauf (jetzt ist es $stunde Uhr UTC) und bei jedem"
            echo "Start von Hand. Wird das Repo oeffentlich, laeuft sie in"
            echo "jedem Lauf - ohne dass hier etwas geaendert werden muss."
            exit 0
          fi
          # --limit deckelt die Versuche, nicht die Treffer: jede Karte
          # kostet vorher einen Abruf des Quelldokuments, und der kostet
          # Zeit auch dann, wenn kein Kontingent mehr da ist.
          python pipeline/kinetic_backfill.py --limit 25 --target 0.5             2>&1 | tee -a "$RUNNER_TEMP/backfill.log"

      # --- Benachrichtigungen zustellen ----------------------------------
      #
      # Laeuft zuletzt und unabhaengig vom Rest: ob Karten erzeugt wurden,
      # hat nichts damit zu tun, ob jemandem gefolgt wurde.
      #
      # Der Takt spielt keine Rolle mehr: zugestellt wird sofort ueber
      # die Edge Function (Migration 0053). Dieser Schritt ist das
      # Auffangnetz fuer das, was dort durchgefallen ist.
      #
      # Fehlen die VAPID-Secrets, beendet sich das Skript mit einer
      # Meldung und laesst die Nachrichten in der Tabelle liegen. Sie
      # gehen nicht verloren, sie warten.
      - name: Push zustellen
        continue-on-error: true
        timeout-minutes: 3
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: python pipeline/push.py

      # --- Was ist rausgekommen? -----------------------------------------
      #
      # Die Uebersichtsseite eines Laufs zeigt von sich aus nur "ingest,
      # 23s" und die Annotationen. Ob zwanzig Karten entstanden sind oder
      # keine, steht dort nicht - dafuer muss man den Lauf aufklappen und
      # das Log lesen.
      #
      # Die Schlussbilanz beider Skripte ist aber genau die Information,
      # die man sehen will, und sie ist vier Zeilen entfernt. `always()`,
      # weil sie bei einem Fehlschlag noch mehr wert ist als bei Erfolg.
      - name: Bilanz in die Uebersicht
        if: always()
        run: |
          for datei in ingest evergreen kurse backfill; do
            pfad="$RUNNER_TEMP/$datei.log"
            [ -f "$pfad" ] || continue
            echo "## $datei" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            # Ab der letzten "Fertig."-Zeile steht die Bilanz. Gibt es
            # keine, ist der Lauf vorher gestorben - dann sind die letzten
            # Zeilen genau das, was man sehen will.
            if grep -q "Fertig\." "$pfad"; then
              sed -n '/Fertig\./,$p' "$pfad" | tail -n 30 >> "$GITHUB_STEP_SUMMARY"
            else
              echo "(kein Abschluss - abgebrochen, letzte Zeilen:)" >> "$GITHUB_STEP_SUMMARY"
              tail -n 15 "$pfad" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done
